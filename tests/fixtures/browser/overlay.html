<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Overlay</title>
  <style>
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      pointer-events: auto;
      z-index: 900;
    }
    #remove {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }
    #hidden {
      margin-top: 120px;
    }
  </style>
</head>
<body>
  <main>
    <button id="hidden" onclick="document.getElementById('status').textContent = 'clicked'">Hidden behind</button>
    <p id="status">not clicked</p>
  </main>
  <div id="overlay"></div>
  <button id="remove" onclick="document.getElementById('overlay').remove()">Remove overlay</button>
</body>
</html>
