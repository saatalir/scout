<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Infinite</title>
  <style>
    .story {
      display: block;
      height: 200px;
      line-height: 200px;
    }
  </style>
</head>
<body>
  <main>
    <div id="stories">
      <a class="story" href="#">Story 1</a>
      <a class="story" href="#">Story 2</a>
      <a class="story" href="#">Story 3</a>
      <a class="story" href="#">Story 4</a>
      <a class="story" href="#">Story 5</a>
      <a class="story" href="#">Story 6</a>
      <a class="story" href="#">Story 7</a>
      <a class="story" href="#">Story 8</a>
      <a class="story" href="#">Story 9</a>
      <a class="story" href="#">Story 10</a>
    </div>
  </main>
  <script>
    let next = 11;
    let loading = false;

    function addStories() {
      if (loading) return;
      loading = true;
      const container = document.getElementById("stories");
      for (let i = 0; i < 10; i++) {
        const a = document.createElement("a");
        a.className = "story";
        a.href = "#";
        a.textContent = "Story " + next++;
        container.appendChild(a);
      }
      loading = false;
    }

    window.addEventListener("scroll", () => {
      const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 500;
      if (nearBottom) addStories();
    });
  </script>
</body>
</html>
