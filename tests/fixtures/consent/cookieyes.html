<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CookieYes fixture</title>
</head>
<body>
  <main>
    <h1>CookieYes page</h1>
    <p>Some content behind the banner.</p>
  </main>

  <div class="cky-consent-container" style="position:fixed;bottom:0;left:0;right:0;background:#eee;padding:12px">
    <p>We use cookies to improve your experience.</p>
    <button class="cky-btn-reject"
            onclick="document.querySelector('.cky-consent-container').style.display='none'; document.body.dataset.consent='rejected';">
      Reject
    </button>
    <button class="cky-btn-accept"
            onclick="document.querySelector('.cky-consent-container').style.display='none'; document.body.dataset.consent='accepted';">
      Accept
    </button>
  </div>
</body>
</html>
