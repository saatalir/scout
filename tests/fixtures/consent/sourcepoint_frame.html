<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sourcepoint frame fixture</title>
</head>
<body>
  <div id="sp_banner" style="background:#eee;padding:12px">
    <p>We use cookies to improve your experience.</p>
    <button title="Reject All"
            class="sp_choice_type_13"
            onclick="parent.document.body.dataset.consent='rejected'; parent.document.getElementById('sp_iframe').style.display='none';">
      Reject All
    </button>
    <button title="Accept All"
            class="sp_choice_type_11"
            onclick="parent.document.body.dataset.consent='accepted'; parent.document.getElementById('sp_iframe').style.display='none';">
      Accept All
    </button>
  </div>
</body>
</html>
