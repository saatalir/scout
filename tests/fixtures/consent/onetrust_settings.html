<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OneTrust settings fixture</title>
</head>
<body>
  <main>
    <h1>OneTrust settings page</h1>
    <p>The reject button is hidden until Cookie Settings is opened.</p>
  </main>

  <div id="onetrust-banner-sdk" style="position:fixed;bottom:0;left:0;right:0;background:#eee;padding:12px">
    <p>We use cookies to improve your experience.</p>
    <button id="onetrust-accept-btn-handler"
            onclick="document.getElementById('onetrust-banner-sdk').style.display='none'; document.body.dataset.consent='accepted';">
      Accept All
    </button>
    <button id="onetrust-pc-btn-handler"
            onclick="document.getElementById('ot-sdk-panel').style.display='block';">
      Cookie Settings
    </button>
  </div>

  <div id="ot-sdk-panel" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#ddd;padding:12px">
    <p>Manage your cookie preferences.</p>
    <button class="ot-pc-refuse-all-handler"
            onclick="document.getElementById('ot-sdk-panel').style.display='none'; document.getElementById('onetrust-banner-sdk').style.display='none'; document.body.dataset.consent='rejected';">
      Reject All
    </button>
    <button class="ot-pc-accept-all-handler"
            onclick="document.getElementById('ot-sdk-panel').style.display='none'; document.getElementById('onetrust-banner-sdk').style.display='none'; document.body.dataset.consent='accepted';">
      Accept All
    </button>
  </div>
</body>
</html>
