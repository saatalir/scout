<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Osano fixture</title>
</head>
<body>
  <main>
    <h1>Osano page</h1>
    <p>Some content behind the banner.</p>
  </main>

  <div class="osano-cm-dialog" style="position:fixed;bottom:0;left:0;right:0;background:#eee;padding:12px">
    <p>We use cookies to improve your experience.</p>
    <button class="osano-cm-denyAll"
            onclick="document.querySelector('.osano-cm-dialog').style.display='none'; document.body.dataset.consent='rejected';">
      Deny All
    </button>
    <button class="osano-cm-acceptAll"
            onclick="document.querySelector('.osano-cm-dialog').style.display='none'; document.body.dataset.consent='accepted';">
      Accept All
    </button>
  </div>
</body>
</html>
