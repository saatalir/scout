<!doctype html>
<html><head><meta charset="utf-8"><title>Consent</title></head>
<body>
  <p>We and our partners use cookies.</p>
  <button onclick="parent.document.body.dataset.consent='accepted'; parent.document.querySelector('iframe').style.display='none'">Yes, I'm happy</button>
  <button onclick="parent.document.body.dataset.consent='rejected'; parent.document.querySelector('iframe').style.display='none'">Reject all</button>
</body></html>
