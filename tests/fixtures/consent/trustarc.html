<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TrustArc fixture</title>
</head>
<body>
  <main>
    <h1>TrustArc page</h1>
    <p>Some content behind the banner.</p>
  </main>

  <div id="truste-consent-track" style="position:fixed;bottom:0;left:0;right:0;background:#eee;padding:12px">
    <p>We use cookies to improve your experience.</p>
    <button id="truste-consent-required"
            onclick="document.getElementById('truste-consent-track').style.display='none'; document.body.dataset.consent='rejected';">
      Required cookies only
    </button>
    <button id="truste-consent-accept"
            onclick="document.getElementById('truste-consent-track').style.display='none'; document.body.dataset.consent='accepted';">
      Accept
    </button>
  </div>
</body>
</html>
