<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Generic EN fixture</title>
</head>
<body>
  <main>
    <h1>Generic EN page</h1>
    <p>Some content behind the banner.</p>
  </main>

  <div role="dialog" style="position:fixed;bottom:0;left:0;right:0;background:#eee;padding:12px">
    <p>We use cookies.</p>
    <button onclick="this.parentElement.style.display='none'; document.body.dataset.consent='rejected';">
      Reject non-essential
    </button>
    <button onclick="this.parentElement.style.display='none'; document.body.dataset.consent='accepted';">
      Accept all
    </button>
  </div>
</body>
</html>
