<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <title>Generic EL fixture</title>
</head>
<body>
  <main>
    <h1>Generic EL page</h1>
    <p>Some content behind the banner.</p>
  </main>

  <div style="position:fixed;bottom:0;left:0;right:0;background:#eee;padding:12px">
    <p>Χρησιμοποιούμε cookies.</p>
    <button onclick="this.parentElement.style.display='none'; document.body.dataset.consent='rejected';">
      Απόρριψη όλων
    </button>
    <button onclick="this.parentElement.style.display='none'; document.body.dataset.consent='accepted';">
      Αποδοχή όλων
    </button>
  </div>
</body>
</html>
