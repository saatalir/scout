<!DOCTYPE html>
<!-- Synthetic page in the markup of html.duckduckgo.com. Replace with a capture
     from the VM (scripts/browser_check.py --capture) once it is up. -->
<html><head><title>{query} at DuckDuckGo</title></head><body>
<div id="links" class="results">
  <div class="result results_links results_links_deep result--ad">
    <h2 class="result__title"><a class="result__a" href="https://ads.example.com/buy">Sponsored hydrogen tanks</a></h2>
    <a class="result__snippet" href="https://ads.example.com/buy">Buy now.</a>
  </div>
  <div class="result results_links results_links_deep web-result">
    <h2 class="result__title"><a rel="nofollow" class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fexample.org%2Fhydrogen-blending%3Futm_source%3Dddg&amp;rut=abc">Hydrogen blending in gas grids</a></h2>
    <a class="result__snippet" href="#">How much hydrogen existing pipelines can carry.</a>
  </div>
  <div class="result results_links results_links_deep web-result">
    <h2 class="result__title"><a rel="nofollow" class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fwww.energy.example.gov%2Freport-{page}%2F&amp;rut=def">Pipeline storage report {page}</a></h2>
    <a class="result__snippet" href="#">Line-pack storage of hydrogen, page {page}.</a>
  </div>
</div></body></html>
