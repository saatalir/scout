[project]
name = "online-scout"
version = "0.1.0"
description = "Online Scout: a local-first web agent. Phase 0: model serving and feasibility evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "playwright>=1.45",
]

[project.optional-dependencies]
router = ["litellm[proxy]>=1.50"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["scout*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
